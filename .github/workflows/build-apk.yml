name: Build PWA to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build web
        run: |
          npm install
          npm run build

      - name: Generate Trusted Web Activity (APK)
        uses: cardinalby/export-android-app-action@v1
        with:
          web-manifest-url: 'https://mohom9910-cpu.github.io/SudaHub-V0.-1/manifest.json'
          package-id: 'com.sudahub.app'
          app-name: 'SudaHub'
