
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A" />
        <stop offset="50%" stop-color="#0A0F1D" />
        <stop offset="100%" stop-color="#06121E" />
      </linearGradient>
      <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981" />
        <stop offset="50%" stop-color="#059669" />
        <stop offset="100%" stop-color="#06B6D4" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#34D399" />
        <stop offset="100%" stop-color="#38BDF8" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15.36" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Icon Container Box if not maskable -->
    
    <rect x="25.6" y="25.6" width="460.8" height="460.8" rx="101.376" fill="#0D1527" stroke="rgba(16, 185, 129, 0.3)" stroke-width="7.68" />
    

    <!-- Background glowing circle -->
    <circle cx="256" cy="256" r="165.888" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)" />

    <!-- Outer Tech Hexagon / Circuit Ring -->
    <circle cx="256" cy="256" r="156.67200000000003" fill="none" stroke="url(#emeraldGrad)" stroke-width="12.8" stroke-dasharray="76.8 25.6" />
    
    <!-- Central Shield / Brand S Symbol -->
    <g transform="translate(256, 256)">
      <!-- Glow effect -->
      <path d="M0,-101.376 C82.944,-101.376 110.592,-36.864000000000004 55.296,0 C115.2,55.296 69.12,110.592 0,110.592 C-82.944,110.592 -110.592,36.864000000000004 -55.296,0 C-115.2,-55.296 -69.12,-101.376 0,-101.376 Z" fill="none" stroke="url(#accentGrad)" stroke-width="20.48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

      <!-- Inner Lightning Bolt / Star / SudaHub Sparkle -->
      <polygon points="0,-64.51200000000001 27.648,-9.216000000000001 64.51200000000001,0 27.648,9.216000000000001 0,64.51200000000001 -27.648,9.216000000000001 -64.51200000000001,0 -27.648,-9.216000000000001" fill="url(#emeraldGrad)" />

      <circle cx="0" cy="0" r="20.736" fill="#FFFFFF" />
    </g>

    <!-- App Name Label (optional for high-res) -->
    
    <text x="256" y="460.79999999999995" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38.4" fill="#10B981" text-anchor="middle" letter-spacing="2">SUDAHUB</text>
    
  </svg>
  