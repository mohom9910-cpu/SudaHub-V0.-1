<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SudaHub | منصة الاشتراكات الرقمية والذكاء الاصطناعي</title>
    <meta name="description" content="منصة سودانية رائدة لتوفير اشتراكات الذكاء الاصطناعي (ChatGPT Plus, Claude, Midjourney)، البرمجيات، وخدمات Starlink في السودان." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#10B981" />
    <meta name="application-name" content="SudaHub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SudaHub" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Meta for Social & App Store Scanners -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SudaHub | منصة الاشتراكات الرقمية والذكاء الاصطناعي" />
    <meta property="og:description" content="توفير اشتراكات الذكاء الاصطناعي، البرمجيات، وباقات Starlink في السودان مع دفع محلي فوري عبر بنكك وفوري." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('SudaHub PWA ServiceWorker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('ServiceWorker registration error:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#0A0F1D] text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
